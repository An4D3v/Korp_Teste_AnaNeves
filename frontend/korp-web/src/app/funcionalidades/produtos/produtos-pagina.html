<header class="cabecalho">
  <div>
    <h1>Produtos</h1>
    <p class="legenda">Cadastro e saldo em estoque. Este e o servico de Estoque, na porta 5001.</p>
  </div>
  <button matButton="filled" (click)="novo()">
    <mat-icon>add</mat-icon>
    Novo produto
  </button>
</header>

<mat-form-field appearance="outline" class="busca">
  <mat-label>Buscar por codigo ou descricao</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input
    matInput
    [ngModel]="termoBusca()"
    (ngModelChange)="aoDigitar($event)"
    placeholder="caneta, P-001..."
    autocomplete="off"
  />
  @if (termoBusca()) {
    <button matIconButton matSuffix (click)="limparBusca()" aria-label="Limpar busca">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>

<div class="cartao">
  <table mat-table [dataSource]="produtos()" class="tabela">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Codigo</th>
      <td mat-cell *matCellDef="let p"><code>{{ p.codigo }}</code></td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descricao</th>
      <td mat-cell *matCellDef="let p">{{ p.descricao }}</td>
    </ng-container>

    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef class="col-saldo">Saldo</th>
      <td mat-cell *matCellDef="let p" class="col-saldo">
        <span class="pastilha" [class]="classeSaldo(p.saldo)">{{ p.saldo }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="col-acoes"></th>
      <td mat-cell *matCellDef="let p" class="col-acoes">
        <button matIconButton (click)="editar(p)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button matIconButton (click)="excluir(p)" matTooltip="Excluir">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
  </table>

  @if (produtos().length === 0) {
    <div class="vazio">
      <mat-icon>inventory_2</mat-icon>
      <p>Nenhum produto encontrado.</p>
    </div>
  }

  <mat-paginator
    [length]="total()"
    [pageSize]="tamanhoPagina()"
    [pageSizeOptions]="[5, 10, 25, 50]"
    showFirstLastButtons
  />
</div>
